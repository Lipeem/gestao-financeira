<title>Gestão Financeira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: livro-caixa com termômetro. Cabeçalho fixo com o saldo de hoje, abas de trabalho,
   e o ano desenhado como doze calendários coloridos pelo saldo de cada dia. */
:root{
  --bg:#EEF1ED; --surface:#FFFFFF; --sunk:#E5EAE4; --ink:#141B17; --muted:#55625A; --faint:#848F88; --line:#D4DBD3;
  --accent:#3445C4; --accent-ink:#FFFFFF; --accent-soft:#E2E6FA;
  --t1:#9F2219; --t2:#DD6B4D; --t3:#E8B843; --t4:#8BC689; --t5:#1E7A48;
  --on-t1:#FFF4F2; --on-t2:#2B0E07; --on-t3:#2B2208; --on-t4:#0C2311; --on-t5:#F0FFF5;
  --pos:#1D7444; --neg:#B3261E; --warn:#9A5F0E; --pre:#DCE1DB; --on-pre:#727D76;
  --shadow:0 1px 2px rgb(20 27 23 / .06), 0 10px 28px -16px rgb(20 27 23 / .25);
  --f-display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D110F; --surface:#151B18; --sunk:#1C2420; --ink:#E5EBE6; --muted:#9DAAA2; --faint:#6E7A73; --line:#29322D;
  --accent:#97A3FF; --accent-ink:#0D110F; --accent-soft:#252C55;
  --t1:#B9362B; --t2:#C9664A; --t3:#C99B30; --t4:#4E9A5B; --t5:#1E7E49;
  --on-t1:#FFF1EE; --on-t2:#1D0904; --on-t3:#1E1603; --on-t4:#04160A; --on-t5:#EAFFF1;
  --pos:#64CB91; --neg:#F3806F; --warn:#E5AC52; --pre:#222A26; --on-pre:#7E8A84;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D110F; --surface:#151B18; --sunk:#1C2420; --ink:#E5EBE6; --muted:#9DAAA2; --faint:#6E7A73; --line:#29322D;
  --accent:#97A3FF; --accent-ink:#0D110F; --accent-soft:#252C55;
  --t1:#B9362B; --t2:#C9664A; --t3:#C99B30; --t4:#4E9A5B; --t5:#1E7E49;
  --on-t1:#FFF1EE; --on-t2:#1D0904; --on-t3:#1E1603; --on-t4:#04160A; --on-t5:#EAFFF1;
  --pos:#64CB91; --neg:#F3806F; --warn:#E5AC52; --pre:#222A26; --on-pre:#7E8A84;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 12px 30px -16px rgb(0 0 0 / .7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.28rem;font-weight:800}
h3{font-size:1rem;font-weight:600;font-family:var(--f-body)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.32rem;letter-spacing:-.02em}
.brand span{font-size:.8rem;color:var(--muted)}
.today-chip{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.today-chip .lbl{font-size:.75rem;color:var(--muted);line-height:1.1}
.today-chip .lbl b{display:block;color:var(--ink);font-size:.82rem;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-weight:600;font-size:.88rem;white-space:nowrap}
.sync{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok{background:var(--pos)} .sync.wait{background:var(--t3)} .sync.err{background:var(--neg)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 14px 11px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-size:.7rem;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:700}
.badge.alert{background:var(--neg);color:#fff}

main{padding-block:20px 64px}
main.is-chat{padding-block:12px 12px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{margin:4px 0 0;color:var(--muted);font-size:.88rem;max-width:68ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width: 920px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* botões e campos */
.btn{font-family:var(--f-body);appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:4px 9px;font-size:.8rem;border-radius:7px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in.sm{padding:5px 7px;font-size:.86rem;border-radius:6px}
textarea.in{resize:vertical;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* banner */
.banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:14px 16px}
.banner .txt{flex:1 1 300px;min-width:0}
.banner .txt b{display:block;margin-bottom:2px}
.banner .txt span{font-size:.88rem;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width: 640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width: 1120px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:1.32rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.kpi .s{font-size:.8rem;color:var(--muted)}
.kpi .bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* faixas de cor */
.b1{background:var(--t1);color:var(--on-t1)} .b2{background:var(--t2);color:var(--on-t2)} .b3{background:var(--t3);color:var(--on-t3)}
.b4{background:var(--t4);color:var(--on-t4)} .b5{background:var(--t5);color:var(--on-t5)} .b0{background:var(--pre);color:var(--on-pre)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.76rem}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border-radius:999px;background:var(--sunk)}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* calendário do ano */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.mcal{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);min-width:0}
.mcal.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mcal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.mcal-h button{appearance:none;border:0;background:none;padding:0;font-family:var(--f-display);font-weight:800;font-size:1rem;text-transform:capitalize}
.mcal-h button:hover{color:var(--accent)}
.mcal-h .num{font-size:.8rem}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dgrid .wd{font-size:.62rem;color:var(--faint);text-align:center;font-weight:600}
.dc{appearance:none;border:0;aspect-ratio:1;border-radius:5px;font-size:.7rem;font-family:var(--f-num);font-weight:500;position:relative;padding:0;display:flex;align-items:center;justify-content:center;min-width:0}
.dc:hover{transform:scale(1.12);z-index:2;box-shadow:var(--shadow)}
.dc.today{outline:2.5px solid var(--ink);outline-offset:1px;z-index:1}
.dc.own::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.85}
.dc.fut{opacity:.92}
.dc.sim{box-shadow:inset 0 0 0 2px var(--accent)}
.mcal-f{display:flex;justify-content:space-between;margin-top:8px;font-size:.74rem;color:var(--muted);gap:8px}

/* gráfico */
.chart{width:100%;min-height:250px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}

/* tabelas */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.t{font-family:var(--f-body);text-align:left;white-space:normal}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.istoday td{background:var(--accent-soft)}
tr.pre td{color:var(--faint)}
td .cell{display:inline-block;padding:2px 8px;border-radius:6px;min-width:84px;text-align:right;font-weight:600}
.prevE{color:var(--pos);font-style:italic} .prevS{color:var(--neg);font-style:italic}
.realS{color:var(--ink)} .realE{color:var(--pos);font-weight:600}
.zero{color:var(--faint)}
.wdname{color:var(--faint);font-size:.75rem;margin-left:4px}

/* chips de status */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.73rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;font-family:var(--f-body)}
.chip.ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.chip.bad{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.chip.att{background:color-mix(in srgb,var(--t3) 30%,transparent);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.card svg{width:13px;height:13px}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .main{min-width:0}
.li .ttl{font-weight:600;overflow-wrap:anywhere}
.li .cmt{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.li .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.li .val{font-family:var(--f-num);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.li .acts{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 4px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted);font-weight:600;text-transform:capitalize}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;font-size:.9rem}

/* compositor */
.composer textarea{min-height:108px;font-family:var(--f-num);font-size:.92rem}
.pvs{display:flex;flex-direction:column;gap:8px}
.pv{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.pv-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pv-f .in{width:auto}
.pv-f .f-data{flex:0 0 140px} .pv-f .f-valor{flex:0 0 100px;text-align:right} .pv-f .f-tipo{flex:0 0 96px}
.pv-f .f-desc{flex:1 1 150px} .pv-f .f-com{flex:2 1 200px} .pv-f .f-sub{flex:0 1 190px} .pv-f .f-forma{flex:0 1 130px} .pv-f .f-conta{flex:0 1 160px}
.pv-rec{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);padding-left:2px}
.pv-rec b{color:var(--ink);font-weight:600}
.pv.bad{border-color:var(--neg)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--pos);border-color:var(--pos)}
.dots i.td{outline:2px solid var(--accent);outline-offset:1px}

/* barras de orçamento */
.bud{display:flex;flex-direction:column;gap:12px}
.bud .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem}
.bud .track{grid-column:1 / -1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.bud .track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--t4)}
.bud .track i.over{background:var(--t1)} .bud .track i.near{background:var(--t3)}

/* conferência */
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 168px;gap:10px 16px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:start}
.pair .side{min-width:0}
.pair .side .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.pair .side .v{font-family:var(--f-num);font-weight:600}
.pair .side .d{font-weight:600;overflow-wrap:anywhere}
.pair .side .c{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.pair .st{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width: 640px){.pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .pair .st{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center}}
.analise{white-space:pre-wrap;font-size:.92rem;line-height:1.55;background:var(--sunk);border-radius:10px;padding:14px 16px;max-width:none}
.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.wk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.wk .v{font-family:var(--f-num);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--sunk);border-radius:10px;padding:14px 14px 14px 46px;position:relative;font-size:.9rem}
.steps li::before{content:counter(s);position:absolute;left:14px;top:13px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.8rem;display:grid;place-items:center}
.steps li b{display:block;margin-bottom:2px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem;padding:8px 0}

/* conversa */
.chat{display:flex;flex-direction:column;height:calc(100dvh - 176px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:440px;padding:0;overflow:hidden}
.chat-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-h .note{font-size:.8rem}
.chat-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:16px;overscroll-behavior:contain}
.msg{max-width:min(640px,90%);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bub{padding:10px 13px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:.95rem}
.msg.me .bub{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.ai .bub{background:var(--sunk);border-bottom-left-radius:5px}
.msg.err .bub{background:color-mix(in srgb,var(--neg) 12%,transparent);color:var(--ink)}
.when{font-size:.7rem;color:var(--faint);display:flex;gap:8px;align-items:center}
.acard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:.86rem;display:flex;flex-direction:column;gap:6px;min-width:min(320px,100%);max-width:100%}
.acard .ln{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.acard .ln .num{white-space:nowrap}
.acard .row{gap:6px}
.acard.undone{opacity:.55}
.cmp{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.cbar{display:flex;gap:8px;align-items:flex-end}
.cbar textarea{flex:1;min-height:44px;max-height:180px;resize:none;line-height:1.4}
.anx{display:flex;gap:6px;flex-wrap:wrap}
.anx .chip button{border:0;background:none;padding:0 0 0 4px;color:inherit;cursor:pointer}
.ex{display:flex;gap:6px;flex-wrap:wrap}
.ex button{font-size:.8rem}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);display:inline-block;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chat.drag{outline:2px dashed var(--accent);outline-offset:-6px}
@media (max-width:560px){.chat-h .note:not(.warn){display:none} .chat-h{padding:10px 14px} .chat{height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:10px} .msg{max-width:94%}}


/* dobras (triângulos) */
details.fold > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:8px;flex-wrap:wrap}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary:hover{background:var(--sunk)}
details.fold > summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

function drawChart() {
  const el = document.getElementById("chart"); if (!el) return; const M = model();

  for (let i = 0; i < 5; i++) { const a = Math.max(lo, Math.min(hi, edges[i])), b = Math.max(lo, Math.min(hi, edges[i + 1])); const o1 = ((Y(a) - pt) / (H - pt - pb) * 100).toFixed(2), o2 = ((Y(b) - pt) / (H - pt - pb) * 100).toFixed(2); stops.push(`<stop offset="${o1}%" stop-color="var(${cols[i]})"/><stop offset="${o2}%" stop-color="var(${cols[i]})"/>`); }
  let bgs = ""; for (let i = 0; i < 5; i++) { const a = Math.max(lo, Math.min(hi, edges[i])), b = Math.max(lo, Math.min(hi, edges[i + 1])); if (Y(b) - Y(a) > 0.5) bgs += `<rect x="${pl}" y="${Y(a).toFixed(1)}" width="${W - pl - pr}" height="${(Y(b) - Y(a)).toFixed(1)}" fill="var(${cols[i]})" opacity=".09"/>`; }

  const ti = ks.indexOf(S.today); let todayMark = "";
  if (ti >= 0) { const p = pts[ti]; todayMark = `<line x1="${X(ti).toFixed(1)}" x2="${X(ti).toFixed(1)}" y1="${pt}" y2="${H - pb}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="${X(ti).toFixed(1)}" cy="${Y(p.fim).toFixed(1)}" r="5.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="${(X(ti) + 8).toFixed(1)}" y="${pt + 10}" style="fill:var(--ink);font-weight:600">hoje</text>`; }

    ${lineMain ? `<path d="${lineMain}" fill="none" stroke="url(#gl)" stroke-width="2.4" stroke-linejoin="round"/>` : ""}

  const hit = el.querySelector("#hit"), tip = el.querySelector("#tip");

}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(1, raw)))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

V.conferir = function () {

V.guia = function () {

  const ex = [

  const sec = (id, titulo, corpo) => `<section class="card gsec" id="g-${id}"><h2>${titulo}</h2>${corpo}</section>`;

  ${S.atalho ? atalhoHtml() : ""}
  <section class="card ghero"><span class="eyebrow">Como usar o painel</span><h1>O termômetro só funciona se o dia for anotado</h1>

  ${sec("comece", "Comece aqui", `<p>${passos.length} passos, uma vez só. Os que o painel consegue verificar sozinho já aparecem marcados: ${feitos} de ${auto}.</p>

  ${sec("hoje", "Hoje, + e gestos", `<p>No celular (e em telas até 760 px) o painel abre em <b>Hoje</b>: quanto ainda cabe em variáveis hoje, o saldo ao fim do dia, como fecha o mês, as próximas duas semanas na cor do saldo, as fixas que vencem nos próximos 7 dias (e as que passaram da data sem confirmação), os últimos lançamentos e, quando houver, as metas. No computador, Hoje é a primeira aba; o painel abre em Ano.</p>
    <div class="gnote"><b>+ Lançar em dois toques</b><p>O + no meio da barra de baixo (ou “+ Lançar gasto” em Hoje) abre uma folha com teclado numérico. Digite o valor, toque na categoria e em Lançar. As categorias que vocês mais usaram nos últimos 90 dias aparecem primeiro; “Outra…” mostra todas. A conta vem no padrão (toque em outra para trocar) e a data em hoje (ou ontem, ou outro dia que já passou; para o futuro, use as compras planejadas em Plano). O comentário é opcional, mas é ele que vai explicar o gasto na conferência. Quando a categoria é de despesa fixa e o valor está a até 50% do previsto, a folha liga o lançamento à fixa do mês sozinha e avisa embaixo; para mudar, abra “Descrição e fixa” (com metas cadastradas, “Descrição, fixa e meta”). No computador o valor se digita no teclado e Enter lança.</p></div>
    <div class="gnote"><b>Parcelado e meta no +</b><p>Quando a conta escolhida é um cartão, aparece a linha <b>Parcelas</b>: À vista, 2×, 3×… (e “Outro…” até 24×). O botão mostra “Lançar 3× de R$ 400,00”. Com metas cadastradas, “Descrição, fixa e meta” tem também o campo “Pago com o dinheiro da meta”.</p></div>
    <div class="gnote"><b>Gestos</b><p>Deslize uma fixa para a direita para marcar como paga (ou recebida) com o valor previsto; se foi outro valor, edite depois. Deslize um lançamento para a esquerda para ver Editar e Apagar. Tocar num lançamento também abre a edição. Vale em Hoje, na aba Lançar e no painel do dia. Na aba Lançar, um lançamento planejado deslizado para a direita vira “Aconteceu”. Com uma linha aberta, o primeiro toque fora dela só fecha. No computador os botões ficam à mostra.</p></div>
    <div class="gnote"><b>Desfazer</b><p>Depois de gravar qualquer coisa por um botão (lançar, apagar, marcar paga, editar, mudar o saldo, o limite, uma fixa ou uma categoria), a mensagem que aparece depois de gravar traz <b>Desfazer</b> por 8 segundos (no computador, Ctrl+Z também desfaz enquanto ela está na tela). Por isso apagar um lançamento não pergunta mais “tem certeza”.  Ficam de fora: apagar um arquivo (é definitivo, por isso pergunta antes) e a Conversa, que tem o Desfazer no próprio cartão da resposta. Enquanto a Conversa está trabalhando, ou se dois botões gravam ao mesmo tempo, a mensagem sai sem Desfazer, e apagar um lançamento volta a pedir confirmação. Se alguém mudou algum dos registros depois, nada volta: o Desfazer é tudo ou nada, para não deixar a conta pela metade.</p></div>
    <div class="gnote"><b>Avisos</b><p>Em Hoje, logo abaixo do resumo do dia, aparecem os avisos que pedem atenção antes de virar problema (três de cada vez; “Mostrar mais” abre o resto). No topo de Ano e Mês ficam só os vermelhos:</p><ul class="glist"><li>o saldo projetado fica negativo nos próximos 45 dias;</li><li>uma fatura vence em até 5 dias, e se a conta que paga cobre;</li><li>uma fixa passou da data sem ser confirmada;</li><li>uma categoria ou subcategoria passou do orçamento do mês, ou já usou 90% faltando 5 dias ou mais;</li><li>ontem não teve nenhum lançamento;</li><li>há linhas do extrato esperando decisão em Conferir;</li><li>o saldo real foi informado há mais de 35 dias;</li><li>nos primeiros 10 dias do mês, o mês anterior ainda não foi fechado;</li><li>uma receita a receber passou da data;</li><li>algum mês dos próximos 6 passou do limite de compromissos.</li></ul><p>O ✕ dispensa o aviso só naquele aparelho (a mensagem traz Desfazer); ele volta quando a situação mudar: outra fatura, outro dia, outro mês, ou mais fixas atrasadas e mais linhas pendentes do que quando foi dispensado. O número na aba Hoje conta os avisos vermelhos e amarelos. Subcategoria só gera aviso de orçamento quando tem valor próprio.</p></div>`)}

  ${sec("rotina", "A rotina", `<div class="grot">

    <div><span class="eyebrow">Todo mês · 20 minutos</span><h3>Feche o mês e planeje o próximo</h3><ul><li>Na tela Mês, toque em <b>Fechar o mês</b>: os passos abaixo aparecem em sequência e cada um se marca quando fica pronto.</li><li>Mande o extrato do mês inteiro e a fatura do cartão.</li><li>Use o saldo final do extrato como saldo real (o botão “Usar … como saldo real” aparece na resposta da Conversa que fez a conferência).</li><li>Reveja as fixas que mudaram de valor e escolha o limite diário do mês seguinte.</li><li>Exporte para Excel em Plano, como cópia de segurança.</li></ul></div></div>`)}

  ${sec("conversa", "Escrevendo na Conversa", `<p>Escreva como falaria. Valor, o que foi e, depois de um travessão, o comentário. O comentário é a memória: “120 mercado” não diz nada em dezembro; “120 mercado — aniversário da avó” diz.</p>

    <div class="gnote"><b>Depois de enviar</b><p>O Claude responde com um cartão mostrando o que lançou: valor, data, se foi no crédito e qual fixa confirmou. Se algo saiu errado, toque em <b>Desfazer</b> no próprio cartão, ou escreva a correção (“era 97”, “foi no débito”).</p></div>
    <div class="gnote"><b>Falar em vez de digitar</b><p>No celular, toque no microfone do teclado e fale, como escreveria: “87 no mercado no crédito, compras da semana”. Funciona na Conversa (o Claude entende a frase falada), na caixa da aba Lançar e no comentário do +. Confira o texto antes de enviar: o ditado às vezes erra números.</p></div>
    <div class="gnote"><b>Todo o histórico</b><p>O Claude da Conversa recebe os últimos 40 dias junto com cada mensagem e, quando precisa de mais, busca no histórico inteiro do painel: “quanto gastei de Uber em 2026?”, “quanto entrou por mês este ano?”, “apaga o mercado de 12 de agosto”. Uma pergunta que precisa buscar demora alguns segundos a mais e gasta um pouco mais do plano do Claude de quem pergunta; lançar e corrigir algo recente custa o mesmo de sempre.</p></div>
    <div class="gnote"><b>Limpar a conversa</b><p>O botão <b>Limpar</b>, no topo da Conversa, apaga todo o histórico de mensagens, para todos que têm acesso ao painel, depois de um aviso de atenção. Os lançamentos, as conferências e os arquivos anexados continuam; os botões Desfazer dos cartões somem junto. Não tem volta.</p></div>
    <div class="gnote"><b>Claro ou escuro</b><p>O botão redondo ao lado do nome do painel alterna entre claro (sol), escuro (lua) e automático (meio círculo, segue o aparelho). A escolha fica guardada só naquele navegador.</p></div>
    <div class="gnote"><b>Arquivo anexado é só leitura</b><p>Quando a mensagem leva um extrato, uma fatura ou um print, a Conversa lê e lança, mas não apaga, não corrige e não muda o saldo real, mesmo que o arquivo tenha algum texto pedindo isso. Para corrigir ou apagar, mande uma mensagem sem anexo. Pagamento de fatura e aplicação/resgate no extrato são reconhecidos pela própria página e não viram gasto.</p></div>
    <div class="gnote"><b>Fotos e comprovantes</b><p>Anexe a foto do cupom ou o print do comprovante e diga o contexto (“remédio da farmácia do bairro”). O Claude lê o valor e lança.</p></div>
    <div class="gnote"><b>Compras parceladas</b><p>Diga em quantas vezes: “tv 1.800 em 6x no Nubank”, “parcelado em 10”, “3x de 120”. O painel cria uma parcela por mês, no mesmo dia da compra, cada uma na fatura certa do cartão. A primeira conta no dia como gasto do dia; as outras entram como saída já comprometida, como uma fixa, sem comer o limite diário. Para apagar a compra inteira, abra uma das parcelas em Lançar e toque em “Apagar as N parcelas”.</p></div>
    <div class="gnote"><b>Compras futuras</b><p>Para ver o impacto antes de decidir, use o simulador “Simular uma compra”, que está nas abas Ano, Mês e Plano. Ele mostra o menor saldo e o primeiro dia no vermelho com e sem a compra, e só grava se você tocar em “Adicionar ao plano”.</p></div>
    <div class="gnote"><b>Categorias</b><p>Diga a categoria ou a subcategoria quando quiser (“50 ração — Pets”); sem dizer, o Claude escolhe pela lista. Se não existir, peça para criar: “cria a subcategoria Ração na categoria Pets e lança 50”. Detalhes na seção <button class="btn sm ghost" data-act="guiaGo" data-sec="categorias">Categorias e orçamento</button>.</p></div>
    <div class="gnote"><b>Qual conta, qual cartão</b><p>Diga o nome quando importar: “87 mercado no Nubank”, “paguei pela Caixa”. Sem o nome, vale o padrão de cada tipo, definido em Plano → Contas e cartões. Nome de cartão já significa crédito. Cada conta aparece com o ícone escolhido (🟣 Nubank, 🔵 Caixa…) nas listas e nos lançamentos.</p></div>
    <div class="gnote"><b>Transferência entre contas</b><p>“500 transferência da Caixa para o Nubank”, “apliquei 300 na poupança”, “paguei a fatura do Nubank pela Caixa”. As duas contas precisam estar em Plano → Contas e cartões. Na aba Lançar e no Editar, escolha o tipo “transferência” e as contas de origem e destino. O filtro “Transferências” da aba Lançar mostra todas.</p></div>
    <div class="gnote"><b>O que o Claude da Conversa sabe e não sabe</b><p>É o mesmo Claude do chat, com o painel como contexto. Antes de cada mensagem ele recebe o saldo de hoje, a projeção dos próximos meses, o limite diário, as fixas em aberto, os lançamentos dos últimos 40 dias, os gastos por categoria e as 10 últimas mensagens. Por isso ele responde “como está minha saúde financeira?” com os números de vocês: onde o dinheiro vai, quais meses ficam no vermelho, que categoria passou. Ele responde curto e só com o que está no painel, não lembra além das 10 últimas mensagens e não acessa a internet. Dicas de orçamento e de gasto, sim; onde investir ou que produto contratar é assunto para um profissional certificado.</p></div>`)}

  ${sec("diferenca", "Conversa ou Lançar?", `<p>As duas gravam no mesmo lugar e o resultado é igual. Muda quem interpreta o que você escreve.</p>
    <div class="tw"><table class="gex"><thead><tr><th></th><th>Conversa</th><th>Lançar</th></tr></thead><tbody>
      <tr><td class="t"><b>Quem entende</b></td><td class="t">O Claude, com o painel como contexto</td><td class="t">Um leitor simples da própria página, por palavras-chave</td></tr>
      <tr><td class="t"><b>O que aceita</b></td><td class="t">Texto livre, perguntas, correções (“era 97”), extratos, faturas, fotos de cupom, criar subcategoria</td><td class="t">Uma linha por gasto: valor, o que foi e o comentário</td></tr>
      <tr><td class="t"><b>Antes de gravar</b></td><td class="t">Grava direto e mostra um cartão com Desfazer</td><td class="t">Mostra cada linha em campos editáveis (data, valor, subcategoria, conta, fixa) e só grava no botão Lançar</td></tr>
      <tr><td class="t"><b>Velocidade e custo</b></td><td class="t">Alguns segundos; usa o plano do Claude de quem escreve</td><td class="t">Instantâneo; não usa o Claude</td></tr>
      <tr><td class="t"><b>Além disso</b></td><td class="t">Responde perguntas sobre os números</td><td class="t">Tem a lista de tudo o que foi lançado, com filtros, edição e exclusão</td></tr></tbody></table></div>
    <div class="gnote"><b>Na prática</b><p>No celular, na hora do gasto: o + (mais rápido e não usa o Claude) ou a Conversa (para escrever do seu jeito, anexar um cupom ou perguntar). Para revisar a semana, corrigir a subcategoria de vários lançamentos ou lançar uma lista copiada: Lançar. Sem permissão do Claude ou com o limite do plano esgotado, a Conversa usa o mesmo leitor simples da aba Lançar para as linhas com valor.</p></div>`)}

  ${sec("categorias", "Categorias e orçamento", `<p>Três níveis, do jeito do método:</p>
    <ol class="gsteps plain"><li><span class="gn">1</span><div><b>Bloco</b><p>Receitas fixas, receitas variáveis, despesas fixas e despesas variáveis. Fixo para sempre.</p></div></li>
    <li><span class="gn">2</span><div><b>Categoria</b><p>O grupo dentro do bloco: Alimentação, Moradia, Transporte, Pets… Você cria, renomeia e organiza.</p></div></li>
    <li><span class="gn">3</span><div><b>Subcategoria</b><p>O que vai em cada lançamento: Mercado, iFood, Uber, Ração. Cada lançamento tem exatamente uma.</p></div></li></ol>
    <div class="gnote"><b>Onde mexer</b><p>Plano → Categorias e orçamento. Toque no triângulo ao lado de cada bloco e de cada categoria para abrir e fechar. Dá para criar subcategoria (e com ela uma categoria nova), renomear subcategoria ou categoria, mudar de bloco e pausar. Renomear atualiza os lançamentos e as fixas que já usavam o nome. Pela Conversa também: “cria a subcategoria Ração na categoria Pets”.</p></div>
    <div class="gnote"><b>Orçamento: categoria, subcategoria ou os dois</b><p>Só as despesas variáveis têm orçamento: as fixas já têm valor em Fixas e receitas. Cada categoria pode ter um valor próprio (“Alimentação: R$ 750”) ou ficar vazia, e aí vale a soma das subcategorias. As subcategorias podem ter valor próprio para você acompanhar mais de perto. Se a categoria tiver valor próprio, é ele que conta no total e no limite diário; a soma das subcategorias aparece ao lado só como referência.</p></div>
    <div class="gnote"><b>Um mês diferente dos outros</b><p>O valor em Plano é o padrão de todos os meses. Para dezembro ter mais mercado, abra a tela Mês de dezembro, toque no triângulo da categoria e mude o valor da categoria ou da subcategoria: vale só para aquele mês e ganha o selo “este mês”. “Voltar ao padrão neste mês” desfaz.</p></div>`)}

  ${sec("extrato", "Conferindo com o extrato", `<ol class="gsteps plain"><li><span class="gn">1</span><div><b>Anexe o arquivo na Conversa</b><p>Extrato da conta ou fatura do cartão, em PDF, CSV, OFX, Excel ou print. Pode mandar a semana ou o mês. PDF escaneado também vale.</p></div></li>
    <li><span class="gn">2</span><div><b>O Claude lê as linhas e o painel cruza</b><p>Mesmo valor e até 3 dias de diferença: <span class="chip ok">bateu</span>. Valor parecido com descrição parecida: <span class="chip bad">divergente</span>. Aparece no banco e não foi anotado: <span class="chip att">só no banco</span>. Foi anotado e não apareceu: <span class="chip">só anotado</span>. Pagamento de fatura é marcado à parte e nunca conta como gasto.</p></div></li>
    <li><span class="gn">3</span><div><b>O Claude escreve a leitura</b><p>Compara os comentários de vocês com o que de fato saiu: padrões, dias acima do limite, fixas que vieram com valor diferente. Termina com até duas ações práticas.</p></div></li>
    <li><span class="gn">4</span><div><b>Você decide o que faltou</b><p>Em Conferir, cada linha só do banco tem “Lançar” (com descrição e categoria já sugeridas) ou “Ignorar”. As divergentes têm “Usar valor do banco” ou “Manter o meu”. Há também um botão para lançar todas as sugestões de uma vez.</p></div></li></ol>
    <div class="gnote"><b>Duas coisas que confundem</b><p>No extrato da conta, as compras no crédito não aparecem: elas vão para a fatura. Por isso ficam como “só anotado” até você mandar a fatura do cartão. E se mandar o mesmo extrato duas vezes, as linhas já conferidas são ignoradas.</p></div>`)}

  ${sec("fechar", "Fechar o mês", `<p>Nos primeiros dez dias de cada mês, Hoje avisa que é hora de fechar o mês anterior. O botão <b>Fechar outubro</b> (com o nome do mês), no topo da tela Mês, abre os seis passos em sequência; cada um se marca sozinho quando fica pronto. O mês que ainda está correndo não se fecha: dá para adiantar os passos, e o botão aparece no dia 1º do mês seguinte.</p>
    <ol class="gsteps plain"><li><span class="gn">1</span><div><b>Conferir com o extrato e a fatura</b><p>Mande o extrato da conta e a fatura do cartão na Conversa e resolva em Conferir o que ficou pendente.</p></div></li>
    <li><span class="gn">2</span><div><b>Comentar o que ficou sem comentário</b><p>A lista dos gastos do mês sem comentário, com um campo em cada um. Escreva e toque em Salvar comentários.</p></div></li>
    <li><span class="gn">3</span><div><b>Atualizar o saldo real</b><p>Com o saldo do app do banco depois do fim do mês, a projeção volta a partir do dinheiro de verdade.</p></div></li>
    <li><span class="gn">4</span><div><b>Revisar as fixas</b><p>As que não foram confirmadas e as que vieram com valor diferente do previsto: dá para usar o valor novo daqui para frente ou manter o antigo.</p></div></li>
    <li><span class="gn">5</span><div><b>Escolher o limite diário do mês seguinte</b><p>As três sugestões, já com as fixas e as metas do mês.</p></div></li>
    <li><span class="gn">6</span><div><b>Guardar uma cópia</b><p>Exportar para Excel ou baixar a cópia completa.</p></div></li></ol>
    <p>Entre os passos 4 e 5 fica o orçamento do mês, só para ler: categoria por categoria, quanto sobrou ou passou.</p>
    <div class="gnote"><b>Fechar não trava nada</b><p>O botão do fim da tela guarda o resumo do mês (receitas, fixas, variáveis, resultado e saldo final) e tira o aviso. Dá para fechar com passos faltando, editar o mês depois e reabrir quando quiser.</p></div>`)}

  ${sec("metas", "Metas e caixinhas", `<p>Uma meta separa dinheiro para um objetivo: reserva de emergência, viagem, IPVA, matrícula. Cadastre em Plano → Metas e caixinhas: o nome, quanto quer juntar e até quando (os dois são opcionais), quanto já tem guardado e quanto guardar por mês, e em que dia.</p>
    <dl class="gdl"><dt>O saldo do painel passa a ser o saldo livre</dt><dd>No dia escolhido de cada mês, a reserva sai do saldo que pinta o calendário, como uma conta a pagar. O total guardado aparece em Hoje, embaixo do saldo do dia (“saldo livre · R$ 1.200 guardados nas metas”). O dinheiro não precisa sair do banco; mover para a poupança ou para uma caixinha é só uma transferência entre contas.</dd>
    <dt>Gasto pago com o dinheiro da meta</dt><dd>Ao lançar, escolha a meta em “Pago com o dinheiro da meta” (no +, dentro de “Descrição, fixa e meta”; em Lançar, no Editar) ou diga na Conversa: “paguei o IPVA, 1.900, com a meta do IPVA”. O gasto usa o que estava guardado e não pesa de novo no saldo livre nem no limite do dia; só o que passar do guardado pesa.</dd>
    <dt>Quanto guardar por mês</dt><dd>Preencha quanto quer juntar e até quando e toque em “Calcular o valor por mês”.</dd>
    <dt>Chegou no valor ou mudou de ideia</dt><dd>O depósito do mês para sozinho quando a meta junta o valor ou passa do prazo. Encerrar uma meta devolve ao saldo livre, no mesmo dia, o que sobrou; “Recomeçar” cria a mesma meta de novo, a partir de hoje e sem nada guardado; apagar faz como se ela nunca tivesse existido.</dd></dl>`)}

  ${sec("planejar", "Agenda e o que vem pela frente", `<dl class="gdl">
    <dt>Fixas na Google Agenda</dt><dd>Em Plano → Fixas e receitas, o botão <b>Agendar</b> de cada linha abre a Google Agenda com o evento pronto: nome, valor previsto e repetição todo mês no dia da fixa (até o fim dela, se tiver). Confira e salve lá, e veja se o evento tem lembrete (o de dia inteiro costuma avisar na véspera ou no dia, conforme a sua agenda). Fixas dos dias 29 e 30 ficam sem evento em fevereiro, porque a agenda pula os meses que não têm esse dia. Se agendar de novo, apague o evento antigo; fixa pausada ou encerrada também precisa ter o evento apagado na agenda. O painel marca “agendada” quando você toca no botão, mas não consegue ver se o evento foi salvo. Se o valor, o dia ou o nome da fixa mudar depois, aparece “mudou: agende de novo”. Mudança só de um mês (“Mudar este mês”) não vai para a agenda.</dd>
    <dt>Receitas incertas</dt><dd>Honorário, freela ou venda que pode não vir ou atrasar: cadastre em Plano → A receber e deixe marcada como incerta (uma receita fixa também pode ser incerta, no Editar dela). No Ano, no Mês e em Hoje, o botão <b>Só as certas</b> mostra o ano sem elas; <b>Todas as receitas</b> volta. A escolha fica guardada naquele aparelho. Se, sem as incertas, o saldo ficar negativo antes, aparece um aviso. Quando o dinheiro entrar, toque em Recebi.</dd>
    <dt>Compromissos dos próximos meses</dt><dd>Em Plano, uma tabela mostra quanto de cada um dos próximos 12 meses já está comprometido com fixas, parcelas, metas e compras planejadas, contra a renda certa, e a lista das compras parceladas com quanto falta e quando terminam. Vocês escolhem o limite (enquanto ninguém escolhe, vale o sugerido: as fixas mais 10 pontos): o mês que passa dele fica vermelho, aparece um aviso, e o ＋ avisa antes de uma compra parcelada passar dele.</dd></dl>`)}

  ${sec("relatorios", "Relatórios do Claude", `<p>Em Plano → <b>Relatórios do Claude</b>, escolha o relatório: todo dia (sobre o dia anterior), uma vez por semana (os últimos 7 dias, no dia que vocês escolherem) ou desligado, e se nos outros dias o Claude deve avisar quando houver pendência.</p>
    <dl class="gdl"><dt>Como chega</dt><dd>Todo dia, por volta das 8h, uma tarefa agendada no app Claude do computador lê o painel de produção e escreve o relatório aqui na Conversa (com o selo “relatório do Claude”), além de mandar uma notificação pelo app do Claude. Ela só roda com o app do Claude aberto no computador; se ele estiver fechado na hora, roda quando abrir. Se ficar dias sem rodar, aparece um aviso.</dd>
    <dt>O que vem no relatório</dt><dd>Quanto saiu em variáveis contra o limite, as maiores categorias, quanto entrou, quantos gastos ficaram sem comentário, o saldo projetado (o que o painel calculou da última vez que foi aberto) e as pendências: fixas atrasadas, receitas a receber que passaram da data, linhas do extrato esperando decisão, dia sem lançamento, saldo real antigo e mês anterior sem fechar.</dd>
    <dt>Mudar a hora ou parar de vez</dt><dd>No app Claude do computador, em Tarefas agendadas, a tarefa “Relatório da gestão financeira”.</dd></dl>`)}

  ${sec("telas", "O que cada tela mostra", `<div class="gtelas">
    <div><h3>Hoje</h3><p>A tela de início no celular: quanto ainda cabe hoje, o saldo ao fim do dia e do mês, as próximas duas semanas na cor do saldo, as fixas da semana, os últimos lançamentos, as contas e os avisos. Detalhes na seção <button class="btn sm ghost" data-act="guiaGo" data-sec="hoje">Hoje, + e gestos</button>.</p></div>
    <div><h3>Ano</h3><p>Os próximos 12 meses (ou 2026 e 2027) como calendários. Cada quadrado é um dia, pintado pelo saldo projetado ao fim dele:</p><div class="legend">${[1, 2, 3, 4, 5].map(b => `<span><i class="b${b}"></i>${L[b]}</span>`).join("")}<span><i class="b0"></i>antes do saldo real</span></div><p>O ponto num dia indica que há lançamento de vocês; o contorno escuro é hoje. Os números do topo respondem às perguntas que importam: saldo de hoje, como fecha o mês, o menor saldo até dez/27 e o primeiro dia no vermelho. Logo abaixo, “Simular uma compra” mostra o ano com uma compra parcelada antes de decidir. Toque num dia para ver o que acontece nele e lançar ali mesmo; se for uma fixa (luz, escola, diarista), confira o campo Fixa logo abaixo: o painel tenta adivinhar pelo nome, mesmo com erro de digitação, e você pode trocar.</p></div>
    <div><h3>Conversa</h3><p>Onde vocês contam os gastos e mandam os extratos. O histórico fica salvo e aparece em qualquer aparelho.</p></div>
    <div><h3>Mês</h3><p>O mês dia a dia, como as colunas da planilha. Número em itálico colorido é previsão (verde entra, vermelho sai); em tinta normal, o que já foi lançado. Logo abaixo dos números do mês, “Contas e cartões”: o dinheiro de cada conta (início, hoje e fim do mês) e a fatura de cada cartão (quanto vence no mês e quanto fica em aberto). Ao lado: as fixas do mês com a situação de cada uma, o orçamento das despesas variáveis por categoria (o triângulo abre as subcategorias, com o valor deste mês editável) e o limite diário com as três sugestões.</p>
      <p class="note">Situação das fixas: <span class="chip">prevista</span> <span class="chip att">vence hoje</span> <span class="chip bad">venceu · confirmar</span> <span class="chip ok">paga</span> <span class="chip ok">paga · conferida</span></p></div>
    <div><h3>Lançar</h3><p>Para revisar com calma: uma caixa onde cada linha vira um lançamento, com tudo editável antes de gravar, e a lista de tudo o que foi lançado, com filtros (cartão, sem comentário, não conferidos) e edição. No celular, deslize um lançamento para a esquerda para editar ou apagar. A diferença para a Conversa está na seção <button class="btn sm ghost" data-act="guiaGo" data-sec="diferenca">Conversa ou Lançar?</button></p></div>
    <div><h3>Conferir</h3><p>As semanas de segunda a domingo (quanto foi anotado, quanto já bateu com o banco, quantos dias tiveram registro) e cada conferência com a leitura do Claude e as decisões pendentes.</p></div>
    <div><h3>Arquivos</h3><p>Os extratos, faturas e cupons enviados pela Conversa: a que período se referem, se já entraram numa conferência, com Abrir, Baixar e Apagar. Mostra também quanto há no banco.</p></div>
    <div><h3>Fechar o mês</h3><p>Abre pelo botão no topo da tela Mês (ou pelo aviso de Hoje nos primeiros dias do mês): os passos do fechamento em sequência, do extrato ao limite do mês seguinte. Detalhes em <button class="btn sm ghost" data-act="guiaGo" data-sec="fechar">Fechar o mês</button>.</p></div>
    <div><h3>Plano</h3><p>O que desenha o futuro: saldo real (o saldo de cada conta e a fatura em aberto de cada cartão), régua de cores, contas e cartões, limite diário de cada mês, fixas e receitas, categorias e orçamento (blocos, categorias e subcategorias, com triângulos para abrir e fechar), simulador de compra, compras planejadas, metas e caixinhas, a receber, compromissos, relatórios do Claude, exportar para Excel, ambiente e versão (teste ou produção, baixar e importar o cadastro) e o histórico de tudo o que foi alterado.</p></div>
    <div><h3>Nome do painel</h3><p>Toque no lápis ✎ ao lado do título, no topo, para mudar o título e o subtítulo. Também dá em Plano → Régua de cores. O nome muda no topo e na aba do navegador; o nome do artefato na lista do claude.ai é definido na publicação.</p></div></div>`)}

  ${sec("regras", "As regras dos números", `<dl class="gdl">
    <dt>O saldo do painel é menor que o do banco</dt><dd>De propósito. Saldo do painel = dinheiro na conta − fatura do cartão em aberto. É o que sobra se tudo for pago hoje. Quando a fatura é paga, os dois números se encontram.</dd>
    <dt>Cartão conta no dia da compra</dt><dd>Gastou R$ 400 no crédito hoje, o termômetro escurece hoje, não daqui a 25 dias. O pagamento da fatura nunca conta de novo, nem lançado, nem vindo do extrato. Cada cartão tem o seu fechamento e vencimento em Plano → Contas e cartões; é por eles que o painel sabe quando cada fatura sai da conta. Cartão sem esses dias é tratado como se a compra saísse da conta no mesmo dia.</dd>
    <dt>O futuro nunca fica vazio</dt><dd>Cada dia futuro já tem as fixas e receitas nas datas certas e o limite diário de variáveis. Calendário vazio mente: aparece verde onde vai ter vermelho.</dd>
    <dt>Dinheiro por conta e fatura por cartão</dt><dd>Embaixo do saldo, no topo da página, fica uma linha pequena com o dinheiro de cada conta ao fim de hoje e a próxima fatura de cada cartão; toque nela para ver os detalhes e o fim do mês. Cada conta parte do saldo informado em Plano → Saldo real e segue os lançamentos feitos nela. As fixas saem da conta delas, o limite diário sai da conta padrão, e a compra no cartão sai da conta pagadora no vencimento da fatura (cartão sem dia de fechamento e vencimento sai no dia). Ao usar o saldo final de um extrato, só a conta do extrato muda.</dd>
    <dt>Transferência entre contas não muda o saldo</dt><dd>O saldo do painel é a soma das contas cadastradas. Passar dinheiro de uma para outra, aplicar ou resgatar numa conta cadastrada, ou pagar a fatura de um cartão pela conta só move o dinheiro de lugar: fica registrado (com ⇄), aparece na conferência dos extratos, mas não é gasto nem entrada. Pix para outra pessoa, ou para uma conta que não está em Contas e cartões, é saída normal.</dd>
    <dt>Fixa paga substitui a previsão</dt><dd>Quando a Luz de novembro é lançada, a previsão de novembro sai e entra o valor real. Nada conta duas vezes.</dd>
    <dt>O limite diário é uma decisão</dt><dd>Não é um cálculo. As sugestões mostram o que fecha o mês no zero, o que guarda a reserva de ${money(+((S.cfg && S.cfg.reservaMin) || 0))} e a média real dos últimos 30 dias. Vocês escolhem; o valor vira a previsão dos dias que faltam e a meta de cada dia.</dd>
    <dt>A cor é para doer</dt><dd>Se os próximos meses estiverem vermelhos, é sinal para agir agora, enquanto ainda dá. ${(() => { const mk = mkOf(S.today); const rs = Object.values(S.recs).filter(r => recActiveIn(r, mk)); const e = rs.filter(r => r.tipo === "entrada").reduce((a, r) => a + +r.valor, 0), sx = rs.filter(r => r.tipo === "saida").reduce((a, r) => a + +r.valor, 0), o = orcTotal(mk); return `Pelo plano de ${MESES[+mk.slice(5) - 1]}, o mês fecha em ${money(e - sx - o)}: receitas ${money(e)} − fixas ${money(sx)} − orçamento de variáveis ${money(o)}.`; })()}</dd>
    <dt>Metas saem do saldo livre</dt><dd>Com metas cadastradas, o saldo que pinta o calendário é o livre: o que está guardado nas metas fica fora dele, mesmo que o dinheiro continue na mesma conta. Gasto pago com a meta usa o guardado e não pesa de novo.</dd>
    <dt>Parcela conta no mês dela</dt><dd>Compra parcelada vira uma parcela por mês. A primeira conta no dia da compra; as outras são saída prevista no mesmo dia dos meses seguintes, cada uma na sua fatura.</dd>
    <dt>Antes do saldo real fica cinza</dt><dd>Os dias anteriores à data do saldo informado não têm conferência. Atualize o saldo real sempre que fechar um extrato.</dd></dl>`)}

  ${sec("dados", "Onde ficam os dados", `<ul class="glist"><li><b>Na nuvem da Anthropic, junto com o artefato.</b> Lançamentos, conversa, conferências e os arquivos anexados ficam no claude.ai. Não depende do seu computador ligado: funciona no navegador ou no app do Claude, no celular ou no computador.</li>
    <li><b>Privado.</b> Só abre quem você compartilhar. Quem tem acesso só de visualização não vê nenhum número. Se o artefato for apagado, tudo vai junto.</li>
    <li><b>Os anexos guardados</b> estão na aba Arquivos, com o período, se já entraram numa conferência, Baixar e Apagar; também abrem pelo link no balão da conversa e em cada conferência. Ficam salvos quando quem envia é você ou um Editor; de um Contribuidor, o extrato é lido e conferido, mas o arquivo original não fica guardado.</li>
    <li><b>Quem pode lançar e quem paga o Claude:</b> está na seção seguinte, <button class="btn sm ghost" data-act="guiaGo" data-sec="compartilhar">Compartilhar o painel</button>.</li>
    <li><b>O Claude da Conversa usa o plano de quem manda a mensagem.</b> Na primeira mensagem ele pede permissão. Uma mensagem simples é rápida e barata; um extrato grande consome mais.</li>
    <li><b>Cópia de segurança:</b> Plano → Exportar para Excel gera um .xlsx com lançamentos, fixas, metas, projeção diária e o resumo mês a mês; Plano → Ambiente e versão → “Baixar a cópia completa” gera um .json com tudo.</li>
    <li><b>Capacidade:</b> o banco aguenta vários anos de uso do jeito de vocês. Na virada do ano, peça ao Claude para arquivar o ano anterior.</li></ul>`)}

  ${sec("compartilhar", "Compartilhar o painel", `<p>Quem você convidar consegue ver e lançar, mas não por um link simples. Numa conta pessoal do Claude, cada pessoa convidada conta como alguém de fora da sua conta, e isso muda as regras.</p>
    <ol class="gsteps plain"><li><span class="gn">1</span><div><b>Convide pelo e-mail, como Editor</b><p>No botão Compartilhar do artefato. A pessoa precisa ter uma conta no Claude (pode ser a gratuita) e entrar com ela.</p></div></li>
    <li><span class="gn">2</span><div><b>Deixe o link público desligado</b><p>Com o link ligado, quem é de fora da sua conta cai para “só visualizar”, e quem só visualiza não vê nenhum número.</p></div></li>
    <li><span class="gn">3</span><div><b>Saiba o que Editor permite</b><p>Lançar, editar, conferir e também alterar a própria página. Para quem é de fora da sua conta não existe um nível que só permita lançar.</p></div></li></ol>
    <div class="gnote"><b>Quem paga o Claude</b><p>Lançar pelo + ou pela aba Lançar, editar e apertar botões não gasta o Claude de ninguém: é só gravação no banco. A Conversa gasta o Claude da conta de quem manda a mensagem: quando outra pessoa escreve ali, usa o plano dela, não o seu. Se o plano dela não permitir ou o limite acabar, gastos com valor ainda entram pelo leitor simples; só a leitura de extrato fica parada.</p></div>
    <div class="gnote"><b>Se o menu de Compartilhar estiver diferente</b><p>Os nomes dos níveis podem mudar com as atualizações do Claude. A regra que vale: quem vai lançar precisa de um nível que permita escrever (Editor ou acima), convidado pelo e-mail, com o acesso por link desligado.</p></div>`)}

  ${sec("versoes", "Teste, produção e versões", `<p>São dois painéis: o de <b>teste</b>, com a etiqueta “Teste” ao lado do título, onde cada mudança é experimentada com dados de mentira, e o de <b>produção</b>, com os números de verdade. Toda mudança nova vai primeiro para o teste e, depois de aprovada, para a produção, com o mesmo número de versão.</p>
    <dl class="gdl"><dt>O número da versão</dt><dd>Fica em Plano → Ambiente e versão e no fim deste Guia. São três partes: a primeira muda quando o formato dos dados muda, a segunda quando entra uma função nova e a terceira numa correção. O que mudou em cada versão fica no histórico de versões, na pasta do projeto no Drive.</dd>
    <dt>Montar um painel novo</dt><dd>Em Plano → Ambiente e versão, “Baixar o cadastro” gera um arquivo com contas, categorias, fixas, metas e limites, sem nenhum lançamento. No painel novo, ainda vazio, “Importar um cadastro” grava tudo isso. Outro caminho: numa cópia do painel de teste, “Apagar os dados de teste” deixa só o cadastro e transforma a cópia em produção.</dd>
    <dt>Cópia de segurança</dt><dd>“Baixar a cópia completa” gera um .json com tudo, e “Exportar para Excel” gera a planilha. Guarde uma das duas ao fechar o mês.</dd>
    <dt>Backup automático</dt><dd>No painel de produção, Plano → Ambiente e versão → Backup automático semanal: com o backup ligado, toda segunda de manhã uma tarefa agendada no app Claude do computador copia todos os registros para a pasta escolhida ali (por padrão, a pasta escrita na tarefa) e guarda as últimas 8 semanas. Ela só roda com o app aberto no computador; se ficar mais de 10 dias sem rodar, aparece um aviso. Para pausar de vez ou mudar o horário, use as Tarefas agendadas do app Claude.</dd></dl>`)}

  ${sec("problemas", "Quando algo dá errado", `<dl class="gdl">
    <dt>“Claude indisponível” ou “bloqueado” no topo da Conversa</dt><dd>A permissão foi negada ou o limite de uso do plano acabou. Recarregue a página e aceite a permissão. Enquanto isso, linhas com valor (“87 mercado crédito”) continuam entrando pelo leitor simples do painel; só a leitura de extrato precisa do Claude.</dd>
    <dt>Lançou errado</dt><dd>Logo depois de gravar, toque em Desfazer na mensagem que aparece. Pela Conversa, use o Desfazer do cartão da resposta ou escreva a correção (“era 97”, “foi ontem”). Passou o aviso, edite em Lançar.</dd>
    <dt>Apagou sem querer</dt><dd>Toque em Desfazer na mensagem logo depois. Se ela já sumiu, o lançamento apagado continua registrado no histórico (Plano), com descrição, valor e data: é só lançar de novo.</dd>
    <dt>Uma conta apareceu duas vezes</dt><dd>A fixa foi lançada sem ser ligada à previsão. Em Lançar, toque em Editar no lançamento e escolha a fixa no campo Fixa: a previsão some e fica só o valor pago. Ao lançar pelo painel do dia ou pela aba Lançar, o mesmo campo aparece antes de gravar.</dd>
    <dt>Um gasto fixo avulso (IPVA, matrícula) comeu o limite do dia</dt><dd>Use uma subcategoria do bloco Despesas fixas: gasto de subcategoria fixa vai para a coluna de fixas e não conta no limite diário de variáveis.</dd>
    <dt>Uma fixa mudou só neste mês</dt><dd>Toque no dia dela no calendário e use “Mudar este mês”: dá para trocar o valor, o dia ou dizer que não acontece. Para desfazer o “não acontece”, use “Volta a acontecer neste mês” na lista de fixas da aba Mês. Se mudou de vez, edite em Plano → Fixas e receitas.</dd>
    <dt>O saldo não bate com o banco</dt><dd>Lembre que o painel desconta a fatura em aberto. Se ainda assim não bater, atualize o saldo real com o valor do app do banco e a fatura atual.</dd>
    <dt>O extrato não foi lido inteiro</dt><dd>Arquivos muito grandes são cortados. Mande por semana ou por mês.</dd>
    <dt>Quem foi convidado não vê os números</dt><dd>O acesso está como Visualizador, ou o link público está ligado. Convide pelo e-mail como Editor e desligue o link público no botão Compartilhar.</dd>
    <dt>Não acho a subcategoria certa</dt><dd>Crie em Plano → Categorias e orçamento (“+ subcategoria aqui”, dentro da categoria) ou peça na Conversa. Para corrigir lançamentos já feitos, edite em Lançar.</dd>
    <dt>O orçamento de um mês ficou diferente dos outros</dt><dd>Algum valor foi mudado só para aquele mês (selo “este mês” na tela Mês). Use “Voltar ao padrão neste mês”.</dd>
    <dt>Quer mudar o painel</dt><dd>Peça ao Claude Code na pasta Automação Financeira do Drive. Ele tem as instruções e o código da página.</dd></dl>`)}
  <p class="note gver">Versão ${VERSAO} · ${VERSAO_DATA.split("-").reverse().join("/")}${ambTeste() ? " · ambiente de teste" : ""}</p>
  </div></div>`;
};

/* ---------- fechar o mês: os passos do método em sequência ---------- */
function fechPassos(mk) { const f = S.cfg && S.cfg.fechPassos; const x = f && typeof f === "object" ? f[mk] : null; return x && typeof x === "object" ? x : {}; }
function fechadoInfo(mk) { const f = S.cfg && S.cfg.fechamentos; const x = f && typeof f === "object" ? f[mk] : null; return x && typeof x === "object" ? x : null; }
function primeiroMesComDados() { let mn = null; for (const l of Object.values(S.lancs)) if (l.status !== "planejado" && (!mn || l.data < mn)) mn = l.data; return mn ? mkOf(mn) : mkOf(S.today); }
function mesParaFechar() { const cur = mkOf(S.today), ant = addMonths(cur, -1); return !fechadoInfo(ant) && ant >= primeiroMesComDados() ? ant : cur; }
V.fechar = function () {
  const cur = mkOf(S.today); const mk = S.fechMk && /^\d{4}-\d{2}$/.test(S.fechMk) && S.fechMk <= cur ? S.fechMk : mesParaFechar(); S.fechMk = mk;
  const M = model(); const Mo = M.months.get(mk); if (!Mo) { S.fechMk = null; S.view = "mes"; return V.mes(); }
  const prox = addMonths(mk, 1); const [y, m] = mk.split("-").map(Number); const ini = `${mk}-01`, fim = ymd(y, m, dim(y, m)); const ro = S.readOnly; const fz = fechadoInfo(mk); const nomeM = MESES[m - 1], nomeP = MESES[+prox.slice(5) - 1];
  const ls = Object.values(S.lancs).filter(l => l.data >= ini && l.data <= fim && l.status !== "ignorado" && l.status !== "planejado");
  const pend = Object.values(S.extrato).filter(x => (x.status === "so_extrato" || x.status === "divergente") && x.data >= ini && x.data <= fim);
  const concs = Object.values(S.concs).filter(c => c.de && c.ate && c.de <= fim && c.ate >= ini);
  const aguard = ls.filter(l => l.status === "lancado" && l.tipo !== "transferencia" && !l.fatura && l.data <= S.today).length;
  const semCom = ls.filter(l => l.tipo === "saida" && !l.recId && !subFixa(l) && !parcSeg(l) && !String(l.comentario || "").trim()).sort((a, b) => a.data.localeCompare(b.data));
  const A = anchorOf(); const fx = fixasDoMes(mk); const late = fx.filter(f => f.st === "late");
  const mudou = fx.filter(f => f.ls.length && f.r.ativa !== false && recActiveIn(f.r, prox) && Math.abs(f.real - +f.r.valor) > Math.max(1, +f.r.valor * 0.05) && !(fechPassos(mk).manter || {})[f.r.id]);
  const gs = gastoPorSub(mk); const orc = catsVar().map(nome => ({ nome, g: r2(subsVar(nome).reduce((t, c) => t + (gs[c.subcategoria] || 0), 0)), o: orcCat(nome, mk) })).filter(x => x.o > 0 || x.g > 0).sort((a, b) => (b.g - b.o) - (a.g - a.o));
  const sg = sugestoes(prox); const limSet = !!(S.cfg.diario && S.cfg.diario[prox] != null);
  const fp = fechPassos(mk); const ok = [concs.length > 0 && !pend.length, !semCom.length, A.definida && A.data > fim, !late.length && !mudou.length, limSet, !!(fp.copia || (fz && fz.exportado))];
  const feitos = ok.filter(Boolean).length;
  const passo = (n, i, t, corpo) => { const f = i == null ? null : ok[i]; return `<section class="card fech-p${f ? " ok" : ""}" id="fp-${n}"><div class="fp-h"><span class="gn" aria-hidden="true">${f ? "✓" : i == null ? "•" : i + 1}</span><h3>${t}</h3><span class="chip ${f ? "ok" : f == null ? "" : "att"}">${f ? "feito" : f == null ? "para ler" : "falta"}</span></div><div class="fp-b">${corpo}</div></section>`; };
  const p1 = `<p>${concs.length ? `${concs.length === 1 ? "Uma conferência cobre" : concs.length + " conferências cobrem"} este mês.` : "Nenhum extrato deste mês foi conferido ainda."}${pend.length ? ` ${pend.length === 1 ? "Uma linha do banco espera" : pend.length + " linhas do banco esperam"} decisão.` : ""}${aguard ? ` ${aguard === 1 ? "Um lançamento ainda espera" : aguard + " lançamentos ainda esperam"} o extrato (as compras no crédito esperam a fatura do cartão).` : ""}</p>${ro ? "" : `<div class="row"><button class="btn" data-act="tab" data-v="conversa">Anexar o extrato na Conversa</button>${pend.length ? '<button class="btn" data-act="tab" data-v="conferir">Resolver em Conferir</button>' : ""}</div>`}`;
  const p2 = semCom.length ? `<p>${semCom.length === 1 ? "Um gasto ficou" : semCom.length + " gastos ficaram"} sem comentário. É o comentário que explica, na conferência, para que foi o dinheiro.</p><div class="fc-list">${semCom.slice(0, 20).map(l => `<div class="fc-i"><span class="num faint">${dCurta(l.data)}</span><span class="fc-d">${esc(l.descricao)}</span><b class="num">${money(+l.valor || 0)}</b>${ro ? "" : `<input class="in sm" id="fc-${esc(l.id)}" data-fc="${esc(l.id)}" placeholder="para que foi?" maxlength="200" aria-label="Comentário de ${esc(l.descricao)} de ${dCurta(l.data)}">`}</div>`).join("")}</div>${semCom.length > 20 ? `<p class="note">E mais ${semCom.length - 20}: salve estes e os próximos aparecem.</p>` : ""}${ro ? "" : '<div class="row"><button class="btn primary" data-act="fechComentar">Salvar comentários</button></div>'}` : "<p>Todos os gastos variáveis do mês têm comentário.</p>";
  const p3 = `<p>${A.data > fim && A.definida ? `O saldo real é de ${dCurta(A.data)}, depois do fim do mês: a projeção parte do banco.` : A.definida ? `O saldo real ainda é de ${dCurta(A.data)}. Informe o saldo de hoje (o do app do banco) e a fatura em aberto; se conferiu o extrato do mês inteiro, use o botão “Usar … como saldo real” em Conferir.` : "O saldo real ainda não foi informado: a projeção parte de R$ 0."}</p>${ro ? "" : '<div class="row"><button class="btn" data-act="guiaIr" data-v="plano" data-sec="ancora">Atualizar o saldo real</button></div>'}`;

  const p4 = (late.length || mudou.length) ? `<div class="list">${late.map(f => `<div class="li"><div class="main"><div class="ttl">${esc(f.r.descricao)}</div><div class="meta"><span class="chip bad">${esc(f.lab)}</span><span class="chip">dia ${+f.due.slice(8)}</span></div></div><div class="val">${f.r.tipo === "entrada" ? "+" : "−"}${money(f.prevV).replace("−", "")}</div>${ro ? "" : `<div class="acts"><button class="btn sm" data-act="payRec" data-id="${esc(f.r.id)}" data-mk="${mk}">${f.r.tipo === "entrada" ? "Recebida" : "Paga"}</button><button class="btn sm ghost" data-act="day" data-d="${f.due}">Outro valor ou não houve</button></div>`}</div>`).join("")}${mudou.map(f => `<div class="li"><div class="main"><div class="ttl">${esc(f.r.descricao)}</div><div class="cmt">Prevista em ${money(+f.r.valor)}, ${f.r.tipo === "entrada" ? "entrou" : "foi paga"} em ${money(f.real)}.</div></div>${ro ? "" : `<div class="acts"><button class="btn sm" data-act="fechRecValor" data-id="${esc(f.r.id)}" data-v="${r2(f.real)}">Usar ${money(f.real)} daqui para frente</button><button class="btn sm ghost" data-act="fechRecOk" data-k="${esc(f.r.id + "|" + mk)}">Manter ${money(+f.r.valor)}</button></div>`}</div>`).join("")}</div>${notaSL}` : `<p>Nenhuma fixa ficou atrasada sem confirmação e nenhuma veio com valor diferente.</p>${notaSL}`;
  const p5 = orc.length ? `<div class="tw"><table><thead><tr><th style="text-align:left">Categoria</th><th>Gasto</th><th>Orçamento</th><th>Resultado</th></tr></thead><tbody>${orc.map(x => `<tr><td class="t">${esc(x.nome)}</td><td>${m0(x.g)}</td><td>${m0(x.o)}</td><td class="${x.g > x.o + 0.5 ? "neg" : "pos"}">${x.g > x.o + 0.5 ? `passou ${m0(x.g - x.o)}` : `sobrou ${m0(x.o - x.g)}`}</td></tr>`).join("")}</tbody></table></div><p class="note">${(() => { const ac = orc.filter(x => x.g > x.o + 0.5); return ac.length ? `Acima do orçamento: ${ac.slice(0, 4).map(x => esc(x.nome)).join(", ")}. Vale ajustar o orçamento de ${nomeP} ou combinar o corte agora.` : "Nenhuma categoria passou do orçamento."; })()}</p>` : "<p>Sem orçamento de variáveis cadastrado.</p>";

  if (mud) { J.desfazendo = false; J.desfeito = true; toast(`Não desfiz: ${mud === 1 ? "1 registro mudou" : mud + " registros mudaram"} depois desta ação, em outra tela ou por outra pessoa. Ajuste à mão.`); return; }
  let falha = 0, n = 0; UNDO.desfazendo = true;
  try { for (const d of docs) { if (d.restaurado) continue; const cur = rawDoc(d.coll, d.id); if (igual(cur, d.antes)) { d.restaurado = true; continue; }

  finally { UNDO.desfazendo = false; J.desfazendo = false; }
  if (falha) { toast("Parte não foi desfeita (falha ao gravar).", { desfazer: () => desfazerJ(J) }); return; }

  if (n) logH("Desfeito pelo aviso", J.nome, `${n} registro${n > 1 ? "s" : ""}`, "estado anterior", "Botão Desfazer");
}
